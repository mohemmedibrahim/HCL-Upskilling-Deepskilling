
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Enquiry | Sweet Bakery</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            🍰 Sweet Bakery
        </a>

        <a href="products.html" class="btn btn-outline-light">
            Back to Products
        </a>
    </div>
</nav>

<!-- Enquiry Form -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">Product Enquiry Form</h3>
                </div>

                <div class="card-body p-4">

                    <form action="contact.html" method="get">

                        <!-- Selected Product -->
                        <div class="mb-3">
                            <label for="product" class="form-label">
                                Selected Product
                            </label>

                            <input type="text" id="product" name="product"
                                class="form-control" readonly required>
                        </div>

                        <!-- Customer Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Your Name
                            </label>

                            <input type="text" id="name" name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required>
                        </div>

                        <!-- Phone Number -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Phone Number
                            </label>

                            <input type="tel" id="phone" name="phone"
                                class="form-control"
                                pattern="[0-9]{10}"
                                minlength="10" maxlength="10"
                                placeholder="Enter 10-digit phone number"
                                inputmode="numeric" required>

                            <div class="form-text">
                                Enter a 10-digit mobile number.
                            </div>
                        </div>

                        <!-- Quantity / Message -->
                        <div class="mb-4">
                            <label for="message" class="form-label">
                                Quantity / Message
                            </label>

                            <textarea id="message" name="message"
                                class="form-control" rows="4"
                                placeholder="Enter quantity or special requirements"
                                required></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-success w-100">
                            Continue to Contact
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Selected Product Auto-Fill -->
<script>
    const params = new URLSearchParams(window.location.search);

    document.getElementById("product").value =
        params.get("product") || "";

    if (!params.get("product")) {
        document.getElementById("product").removeAttribute("required");
        document.getElementById("product").placeholder =
            "Please select a product first";
    }
</script>

<!-- Bootstrap JavaScript CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
